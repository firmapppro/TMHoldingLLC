<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 590" role="img" aria-label="TM Holding LLC original signature"><g><defs>
    <!-- Multi-stop luxury metallic gold gradients -->
    <linearGradient id="goldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF4E2" />
      <stop offset="25%" stop-color="#E2C17C" />
      <stop offset="50%" stop-color="#B88E3E" />
      <stop offset="75%" stop-color="#EED7A1" />
      <stop offset="100%" stop-color="#9A742A" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F7E7C4" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A742A" />
      <stop offset="50%" stop-color="#6B4F1B" />
      <stop offset="100%" stop-color="#463310" />
    </linearGradient>

    <linearGradient id="goldSheen" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#FFF2D6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.2" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background is transparent so it can sit on obsidian, navy or white -->

  <!-- Outer Prestige Geometric Cartouche -->
  <g class="cartouche" opacity="0.85">
    <!-- Outer hairline octagonal diamond -->
    <polygon points="250,22 435,98 478,250 435,402 250,478 65,402 22,250 65,98" 
             fill="none" stroke="url(#goldPrimary)" stroke-width="1.2" stroke-opacity="0.5" />
    <!-- Inner concentric frame -->
    <polygon points="250,36 422,106 462,250 422,394 250,464 78,394 38,250 78,106" 
             fill="none" stroke="url(#goldPrimary)" stroke-width="0.75" stroke-opacity="0.25" stroke-dasharray="8 4" />
    <!-- Cardinal diamond pips -->
    <rect x="247" y="19" width="6" height="6" transform="rotate(45 250 22)" fill="url(#goldLight)" />
    <rect x="247" y="475" width="6" height="6" transform="rotate(45 250 478)" fill="url(#goldLight)" />
    <rect x="19" y="247" width="6" height="6" transform="rotate(45 22 250)" fill="url(#goldLight)" />
    <rect x="475" y="247" width="6" height="6" transform="rotate(45 478 250)" fill="url(#goldLight)" />
  </g>

  <!-- Central Interlocking TM Monogram Core -->
  <g id="monogram-core">
    
    <!-- 1. The T - Aerodynamic Swept Wing Upper Bar -->
    <!-- Left Wing (Light Bevel) -->
    <path d="M 96,152 L 250,116 L 250,146 L 118,174 Z" fill="url(#goldLight)" />
    <!-- Left Wing Underbody (Dark Shadow Facet) -->
    <path d="M 118,174 L 250,146 L 250,154 L 126,178 Z" fill="url(#goldDark)" />
    
    <!-- Right Wing (Light Bevel) -->
    <path d="M 404,152 L 250,116 L 250,146 L 382,174 Z" fill="url(#goldPrimary)" />
    <!-- Right Wing Underbody (Dark Shadow Facet) -->
    <path d="M 382,174 L 250,146 L 250,154 L 374,178 Z" fill="url(#goldDark)" />
    
    <!-- Central T Vertical Pillar (Architectural Stability) -->
    <!-- Left half pillar (Light) -->
    <path d="M 234,146 L 250,146 L 250,296 L 234,282 Z" fill="url(#goldLight)" />
    <!-- Right half pillar (Shaded) -->
    <path d="M 250,146 L 266,146 L 266,282 L 250,296 Z" fill="url(#goldDark)" />
    <!-- T Keystoned Apex Point -->
    <polygon points="234,282 250,296 266,282 250,314" fill="url(#goldPrimary)" />

    <!-- 2. The M - Maritime Prow, Twin Spires & Hydrodynamic Keel -->
    <!-- Left Outer Column (Light facet) -->
    <path d="M 126,380 L 158,188 L 182,188 L 156,380 Z" fill="url(#goldPrimary)" />
    <!-- Left Column Bevel / Reflection -->
    <path d="M 158,188 L 170,188 L 146,380 L 136,380 Z" fill="url(#goldLight)" opacity="0.7" />

    <!-- Right Outer Column (Dark facet) -->
    <path d="M 374,380 L 342,188 L 318,188 L 344,380 Z" fill="url(#goldDark)" />
    <!-- Right Column Bevel / Reflection -->
    <path d="M 342,188 L 330,188 L 354,380 L 364,380 Z" fill="url(#goldPrimary)" opacity="0.8" />

    <!-- Left Diagonal Inward Descent (Cutting Keel) -->
    <path d="M 182,188 L 234,282 L 216,282 L 168,206 Z" fill="url(#goldLight)" />
    <!-- Left Diagonal Shadow facet -->
    <path d="M 168,206 L 216,282 L 206,282 L 162,216 Z" fill="url(#goldDark)" />

    <!-- Right Diagonal Inward Descent -->
    <path d="M 318,188 L 266,282 L 284,282 L 332,206 Z" fill="url(#goldPrimary)" />
    <!-- Right Diagonal Shadow facet -->
    <path d="M 332,206 L 284,282 L 294,282 L 338,216 Z" fill="url(#goldDark)" />

    <!-- 3. Maritime Keel & Hull Base (Lower Interlocking Chevron) -->
    <!-- Left Keel Blade -->
    <path d="M 126,380 L 250,432 L 250,412 L 156,370 Z" fill="url(#goldPrimary)" />
    <!-- Left Keel Bevel -->
    <path d="M 156,370 L 250,412 L 250,402 L 176,364 Z" fill="url(#goldLight)" />

    <!-- Right Keel Blade -->
    <path d="M 374,380 L 250,432 L 250,412 L 344,370 Z" fill="url(#goldDark)" />
    <!-- Right Keel Bevel -->
    <path d="M 344,370 L 250,412 L 250,402 L 324,364 Z" fill="url(#goldPrimary)" />

    <!-- Keel Fin / Anchor Apex Point -->
    <polygon points="250,412 256,432 250,446 244,432" fill="url(#goldLight)" />

    <!-- 4. Fine Horizon & Navigation Accents -->
    <!-- Left wingtip navigation fin -->
    <polygon points="96,152 82,146 90,162 104,160" fill="url(#goldLight)" />
    <!-- Right wingtip navigation fin -->
    <polygon points="404,152 418,146 410,162 396,160" fill="url(#goldPrimary)" />

    <!-- Center Precision Diamond Core -->
    <polygon points="250,92 257,104 250,116 243,104" fill="url(#goldLight)" />
    <circle cx="250" cy="104" r="1.5" fill="#FFFFFF" />
  </g>
